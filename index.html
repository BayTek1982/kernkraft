<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernkraftwerk-Schule</title>
<meta name="theme-color" content="#04070E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Kompass Dark: Terminal-Look, große Bento-Kacheln, Mono-Überschriften, eine Akzentfarbe pro Bereich */
:root{
  --bg:#F3F5F9; --flaeche:#FFFFFF; --flaeche2:#E9EDF4; --linie:#D5DBE6;
  --text:#0D1320; --grau:#566074;
  --blau:#1C6BD0; --gruen:#0B8F59; --gold:#9A6A00; --rot:#CC3838; --violett:#6646CF;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Inter",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04070E; --flaeche:#0B111C; --flaeche2:#121A28; --linie:#1D2636;
    --text:#ECF0F6; --grau:#8A93A6;
    --blau:#4DA3FF; --gruen:#26D68C; --gold:#F5C442; --rot:#F05A5A; --violett:#A98BFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04070E; --flaeche:#0B111C; --flaeche2:#121A28; --linie:#1D2636;
  --text:#ECF0F6; --grau:#8A93A6;
  --blau:#4DA3FF; --gruen:#26D68C; --gold:#F5C442; --rot:#F05A5A; --violett:#A98BFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
h1,h2,h3{font-family:var(--mono);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.mono{font-family:var(--mono)}
.klein{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grau)}

.rahmen{max-width:1180px;margin:0 auto;padding:0 16px 48px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.marke{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.marke b{font-family:var(--mono);font-size:18px}
.thema{display:flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden;background:var(--flaeche)}
.thema button{border:0;background:none;padding:8px 10px;font-size:13px;font-family:var(--mono);color:var(--grau)}
.thema button[aria-pressed="true"]{background:var(--flaeche2);color:var(--text)}

.gitter{display:block}
.seite{display:none}
@media (min-width:960px){
  .gitter{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
  .seite{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--linie);border-radius:14px;background:var(--flaeche);padding:14px}
}
.seite input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--linie);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.seite h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--akz);margin-top:6px}
.seite a{display:block;padding:5px 6px;border-radius:6px;font-size:14px;color:var(--text);text-decoration:none}
.seite a:hover{background:var(--flaeche2)}
.seite a.aus{color:var(--grau);pointer-events:none}
.seite a.hier{background:var(--flaeche2)}

.zurueck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linie);background:var(--flaeche);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:13px;text-decoration:none;color:var(--text);margin-bottom:14px}
.titelblock{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.titelblock h1{font-size:26px}
.titelblock p{color:var(--grau);max-width:60ch}

.bento{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:620px){.bento{grid-template-columns:1fr 1fr}.bento .breit{grid-column:span 2}}
.kachel{display:flex;flex-direction:column;gap:10px;text-align:left;text-decoration:none;color:var(--text);background:var(--flaeche);border:1px solid var(--linie);border-top:3px solid var(--akz);border-radius:16px;padding:18px;min-height:170px}
.kachel:hover{background:var(--flaeche2)}
.kachel svg{width:44px;height:44px;color:var(--akz)}
.kachel h2{font-size:19px}
.kachel p{color:var(--grau);font-size:15px;flex:1}
.balken{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--grau);font-variant-numeric:tabular-nums}
.balken i{flex:1;height:6px;border-radius:3px;background:var(--flaeche2);overflow:hidden;display:block}
.balken i b{display:block;height:100%;background:var(--akz)}
.kachel.aus{opacity:.65;pointer-events:none}

.karten{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.karten{grid-template-columns:1fr 1fr}}
.karte{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);background:var(--flaeche);border:1px solid var(--linie);border-left:3px solid var(--akz);border-radius:12px;padding:14px}
.karte:hover{background:var(--flaeche2)}
.karte .klein{display:flex;justify-content:space-between;gap:8px}
.karte b{font-family:var(--mono);font-size:16px}
.karte.aus{border-left-color:var(--linie);color:var(--grau);pointer-events:none}
.haken{color:var(--gruen)}

.buehne{background:var(--flaeche);border:1px solid var(--linie);border-radius:16px 16px 0 0;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:360/280}
.steuer{background:var(--flaeche);border:1px solid var(--linie);border-top:0;border-radius:0 0 16px 16px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.reihe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rund{width:42px;height:42px;border-radius:50%;border:1px solid var(--linie);background:var(--flaeche2);display:grid;place-items:center;flex:none}
.rund.haupt{background:var(--akz);border-color:var(--akz);color:var(--bg)}
.rund svg{width:18px;height:18px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--akz);height:28px}
.chip{min-width:40px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--linie);background:var(--flaeche2);font-family:var(--mono);font-size:14px}
.chip[aria-pressed="true"]{background:var(--akz);border-color:var(--akz);color:var(--bg);font-weight:700}
.tempo{display:flex;align-items:center;gap:8px;margin-left:auto}
.erkl{margin-top:14px;background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.erkl .klein{color:var(--akz)}
.erkl h2{font-size:18px}
.erkl p{max-width:65ch}
.merk{margin-top:12px;border:1px dashed var(--akz);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.merk p{font-family:var(--mono);font-weight:700}
.boxen{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:620px){.boxen{grid-template-columns:1fr 1fr}}
.box{background:var(--flaeche);border:1px solid var(--linie);border-left:3px solid var(--f);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.box .klein{color:var(--f)}
.box p{font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--linie);background:var(--flaeche);font-size:16px;line-height:1.4}
.opt:not(:disabled):hover{background:var(--flaeche2)}
.opt:disabled{cursor:default;color:var(--grau)}
.opt.richtig{border-color:var(--gruen);background:color-mix(in srgb,var(--gruen) 16%,var(--flaeche));color:var(--text)}
.opt.falsch{border-color:var(--rot);background:color-mix(in srgb,var(--rot) 16%,var(--flaeche));color:var(--text)}
.gross{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--gold);color:var(--bg);font-family:var(--mono);font-weight:700;font-size:15px}
.zurLektion{font-family:var(--mono);font-size:13px;color:var(--blau);text-decoration:none;margin-top:4px}
.zw{font-size:16px;margin:18px 0 10px}
.weiter{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.weiter a{flex:1;border:1px solid var(--linie);background:var(--flaeche);border-radius:12px;padding:12px;text-decoration:none;color:var(--text);font-family:var(--mono);font-size:14px;display:flex;flex-direction:column;gap:2px}
.weiter a:last-child{text-align:right}
.weiter a.aus{color:var(--grau);pointer-events:none}
</style>
</head>
<body>
<div class="rahmen">
  <header class="kopf">
    <a class="marke" href="#start"><span class="klein">Kompass Schule</span><b>Kernkraftwerk</b></a>
    <div class="thema" role="group" aria-label="Farbschema">
      <button type="button" data-thema="dunkel">☾ Dunkel</button>
      <button type="button" data-thema="hell">☀ Hell</button>
      <button type="button" data-thema="auto">◐ Auto</button>
    </div>
  </header>
  <div class="gitter">
    <nav class="seite" id="seite" aria-label="Alle Lektionen"></nav>
    <main id="inhalt"></main>
  </div>
</div>

<script>
"use strict";
/* ---------- Speicher (darf fehlen) ---------- */
function lies(k,ersatz){try{const v=localStorage.getItem(k);return v===null?ersatz:JSON.parse(v)}catch(e){return ersatz}}
function schreib(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- Daten: einzige Quelle für App, Shorts und Stimme ---------- */
const BEREICHE=[
 {id:1,name:"Atom & Kernspaltung",kurz:"Woraus ein Atom besteht und was passiert, wenn ein Kern zerbricht.",farbe:"blau",icon:"atom"},
 {id:2,name:"Der Reaktor",kurz:"Brennstäbe, Moderator und Steuerstäbe: so wird die Kettenreaktion gezähmt.",farbe:"gold",icon:"reaktor"},
 {id:3,name:"Vom Dampf zum Strom",kurz:"Wie aus heißem Wasser Dampf, Drehung und am Ende Strom wird.",farbe:"gruen",icon:"turbine"},
 {id:4,name:"Sicherheit",kurz:"Barrieren, Schnellabschaltung, Notkühlung und was bei Unfällen schiefging.",farbe:"rot",icon:"schild"},
 {id:5,name:"Strahlung & Abfall",kurz:"Alpha, Beta, Gamma, Halbwertszeit und wohin der Atommüll kommt.",farbe:"violett",icon:"strahlung"}
];
const LEKTIONEN=[
 {nr:1,b:1,titel:"Das Atom: Kern und Hülle",zeichne:"atom",
  bild:"Ein Atom: in der Mitte der kleine Kern aus Protonen und Neutronen, außen kreisen Elektronen.",
  schritte:[
   {titel:"Der Kern",dauer:6,text:"In der Mitte jedes Atoms sitzt der Kern. Er besteht aus Protonen und Neutronen. Protonen sind positiv geladen, Neutronen haben keine Ladung."},
   {titel:"Die Hülle",dauer:6,text:"Um den Kern bewegen sich Elektronen. Sie sind negativ geladen und bilden die Hülle. Der positive Kern hält sie fest."},
   {titel:"Fast alles ist leer",dauer:7,text:"Der Kern ist zehntausende Male kleiner als das ganze Atom. Wäre das Atom so groß wie ein Fußballstadion, wäre der Kern etwa so groß wie eine Erbse in der Mitte. Trotzdem stecken über 99,9 Prozent der Masse im Kern."},
   {titel:"Die Protonen bestimmen den Stoff",dauer:7,text:"Die Zahl der Protonen legt fest, welcher Stoff es ist. 1 Proton ist Wasserstoff, 6 Protonen sind Kohlenstoff, 92 Protonen sind Uran. Uran hat einen der schwersten Kerne, die in der Natur vorkommen."}
  ],
  merksatz:"Kern: Protonen und Neutronen. Hülle: Elektronen. Die Protonen bestimmen den Stoff.",
  boxen:{
   was:"Ein Atom ist der kleinste Baustein eines Stoffes. Es besteht aus einem winzigen, schweren Kern und einer Hülle aus Elektronen.",
   so:"Im Kern sitzen Protonen (positiv) und Neutronen (neutral). In der Hülle sind die Elektronen (negativ). Die Zahl der Protonen sagt dir, welcher Stoff es ist.",
   bedeutet:"Chemie spielt sich in der Hülle ab, zum Beispiel beim Verbrennen. Kernkraft kommt aus dem Kern. Dort wirken viel größere Kräfte, deshalb steckt dort auch viel mehr Energie.",
   tipp:"Die Kreisbahnen im Bild sind eine Vereinfachung. In Wirklichkeit bilden die Elektronen eher eine Wolke um den Kern."
  }},
 {nr:2,b:1,titel:"Uran, der Brennstoff",zeichne:"uran",
  bild:"Zwei Uran-Sorten im Vergleich, dann der Anteil von Uran-235 in Natururan und in angereichertem Uran, zuletzt eine Brennstoff-Tablette.",
  schritte:[
   {titel:"Zwei Sorten Uran",dauer:6,text:"Jeder Uran-Kern hat 92 Protonen. Die Zahl der Neutronen kann aber verschieden sein. Solche Sorten heißen Isotope. Die wichtigsten sind Uran-238 und Uran-235."},
   {titel:"Nur eine Sorte spaltet sich leicht",dauer:7,text:"Uran-238 schluckt ein langsames Neutron meist nur, ohne zu zerbrechen. Trifft das Neutron dagegen auf Uran-235, zerbricht der Kern. Für den Reaktor zählt deshalb vor allem Uran-235."},
   {titel:"Natururan",dauer:6,text:"In Uran aus dem Bergwerk sind nur 7 von 1.000 Kernen Uran-235. Das sind 0,7 Prozent. Für die meisten Reaktoren ist das zu wenig."},
   {titel:"Anreicherung",dauer:7,text:"Darum wird der Anteil von Uran-235 in Fabriken erhöht, auf 3 bis 5 Prozent. Das nennt man Anreicherung. Für eine Bombe bräuchte man rund 90 Prozent. Reaktor-Uran kann also nicht wie eine Atombombe explodieren."},
   {titel:"Die Tablette",dauer:6,text:"Das angereicherte Uran wird zu Urandioxid verarbeitet, zu Tabletten gepresst und hart gebrannt. Eine Tablette ist etwa 1 Zentimeter groß und wiegt nur wenige Gramm."}
  ],
  merksatz:"Natururan hat 0,7 Prozent Uran-235. Der Reaktor braucht 3 bis 5 Prozent.",
  boxen:{
   was:"Uran ist ein schweres Metall aus der Erde. Als Brennstoff zählt vor allem die Sorte Uran-235, weil sich ihr Kern leicht spalten lässt.",
   so:"Uran abbauen, den Anteil von Uran-235 von 0,7 auf 3 bis 5 Prozent erhöhen und daraus Urandioxid-Tabletten pressen.",
   bedeutet:"Anreicherung ist aufwendig und wird streng überwacht. Dieselbe Technik könnte mit viel mehr Aufwand auch Bomben-Uran herstellen.",
   tipp:"Die Zahl hinter dem Namen ist die Summe aus Protonen und Neutronen. Uran-235 heißt: 92 Protonen + 143 Neutronen."
  }},
 {nr:3,b:1,titel:"Die Kernspaltung",zeichne:"spaltung",
  bild:"Ein Neutron trifft einen Uran-Kern. Der Kern zerbricht in zwei kleinere Kerne und drei Neutronen.",
  schritte:[
   {titel:"Der Uran-Kern",dauer:6,text:"Das ist der Kern eines Uran-235-Atoms. Er besteht aus 92 Protonen und 143 Neutronen, zusammen 235 Teilchen. Im Bild siehst du nur einen Teil davon. So ein großer Kern hält gerade noch zusammen."},
   {titel:"Ein Neutron kommt",dauer:6,text:"Von links fliegt ein einzelnes Neutron heran. Es ist elektrisch neutral, deshalb stößt der Kern es nicht ab. Langsame Neutronen werden besonders leicht eingefangen."},
   {titel:"Der Kern wird instabil",dauer:6,text:"Der Kern nimmt das Neutron auf. Für einen Moment ist er Uran-236 und hat zu viel Energie. Er schwingt, zieht sich in die Länge und schnürt sich in der Mitte ein."},
   {titel:"Der Kern zerbricht",dauer:6,text:"Der Kern reißt in zwei kleinere Kerne, hier Barium-141 und Krypton-92. Dazu werden 3 Neutronen frei. Die Rechnung geht auf: 141 + 92 + 3 = 236."},
   {titel:"Wärme entsteht",dauer:7,text:"Die beiden Bruchstücke fliegen mit rund 10.000 Kilometern pro Sekunde auseinander und werden vom umgebenden Material gebremst. Aus der Bewegung wird Wärme. Die freien Neutronen können weitere Kerne spalten."}
  ],
  merksatz:"Neutron rein, zwei Kerne und neue Neutronen raus, dazu Wärme.",
  boxen:{
   was:"Kernspaltung heißt: Ein schwerer Atomkern zerfällt in zwei leichtere Kerne. Dabei werden Neutronen und sehr viel Energie frei.",
   so:"Erstens trifft ein langsames Neutron auf Uran-235. Zweitens wird der Kern zu Uran-236 und schwingt. Drittens zerbricht er in zwei Bruchstücke und 2 bis 3 Neutronen.",
   bedeutet:"Eine einzige Spaltung liefert rund 200 MeV (eine Energie-Einheit für einzelne Atome). Das ist etwa 50 Millionen Mal mehr als beim Verbrennen eines Kohlenstoff-Atoms. Darum reicht wenig Uran für viel Strom.",
   tipp:"Barium und Krypton sind nur ein Beispiel. Der Kern kann auf viele Arten zerbrechen. Die Summe der Teilchen bleibt aber immer gleich."
  }},
 {nr:4,b:1,titel:"Die Kettenreaktion",zeichne:"kette",
  bild:"Aus einer Spaltung werden zwei, dann vier, dann acht. Zum Schluss die gebremste Kette im Reaktor: immer eine nach der anderen.",
  schritte:[
   {titel:"Die erste Spaltung",dauer:6,text:"Ein Neutron spaltet einen Uran-Kern. Dabei werden 2 bis 3 neue Neutronen frei. Im Bild rechnen wir einfach mit 2."},
   {titel:"Jedes Neutron trifft einen Kern",dauer:6,text:"Die neuen Neutronen treffen auf weitere Uran-Kerne und spalten sie. Jetzt gibt es schon 2 Spaltungen und 4 freie Neutronen."},
   {titel:"Die Lawine",dauer:7,text:"So geht es weiter: 4, 8, 16, 32. Jede Runde dauert nur einen winzigen Bruchteil einer Sekunde. Ohne Bremse wächst die Zahl der Spaltungen wie eine Lawine."},
   {titel:"Im Reaktor: genau eins",dauer:9,text:"Im Reaktor darf von den neuen Neutronen im Schnitt genau eines wieder einen Kern spalten. Die übrigen werden geschluckt oder gehen verloren. Dann bleibt die Zahl der Spaltungen gleich, und der Reaktor liefert gleichmäßig Wärme."}
  ],
  merksatz:"Eine Spaltung löst die nächste aus. Im Reaktor im Schnitt genau eine.",
  boxen:{
   was:"Bei einer Kettenreaktion löst jede Spaltung die nächste aus, weil die frei werdenden Neutronen weitere Kerne treffen.",
   so:"Zähle, wie viele Neutronen aus einer Spaltung wieder eine Spaltung auslösen. Mehr als eins: Es wird mehr. Genau eins: Es bleibt gleich. Weniger als eins: Es hört auf.",
   bedeutet:"Im Reaktor wird die Kettenreaktion genau auf eins gehalten. In einer Atombombe soll sie dagegen so schnell wie möglich wachsen.",
   tipp:"Rechenaufgabe: Verdoppelt sich die Zahl in jeder Runde, sind es nach 10 Runden schon 1.024 Spaltungen (2 hoch 10)."
  }},
 {nr:5,b:1,titel:"Aus Masse wird Wärme",zeichne:"masse",
  bild:"Nach der Spaltung fehlt etwas Masse. Sie wird zu Energie. 1 Kilogramm Uran-235 entspricht 45 Güterwagen Steinkohle.",
  schritte:[
   {titel:"Nach der Spaltung fehlt etwas",dauer:7,text:"Wiegt man alle Teile vor und nach der Spaltung, fällt etwas auf: Nachher fehlt ein winziges Stück Masse, etwa ein Tausendstel."},
   {titel:"E = m · c²",dauer:7,text:"Die fehlende Masse ist nicht verschwunden. Sie ist zu Energie geworden. Das beschreibt Einsteins Formel E = m · c². Weil die Lichtgeschwindigkeit c riesig ist, wird aus sehr wenig Masse sehr viel Energie."},
   {titel:"Der Vergleich mit Kohle",dauer:7,text:"Würde man 1 Kilogramm Uran-235 vollständig spalten, käme so viel Wärme heraus wie beim Verbrennen von rund 2.700 Tonnen Steinkohle. Das sind etwa 45 volle Güterwagen."},
   {titel:"Aus Wärme wird Strom",dauer:7,text:"Im Kraftwerk entsteht die Wärme im Brennstab. Sie macht Wasser heiß, und der Dampf treibt die Turbine an. Nur etwa ein Drittel der Wärme wird am Ende zu Strom, der Rest ist Abwärme."}
  ],
  merksatz:"Ein Tausendstel der Masse wird zu Energie: E = m · c².",
  boxen:{
   was:"Bei der Spaltung verschwindet ein winziger Teil der Masse. Er wird zu Energie. Diese Energie ist die Wärme des Kernkraftwerks.",
   so:"Masse vorher minus Masse nachher ergibt die fehlende Masse. Mal Lichtgeschwindigkeit zum Quadrat ergibt die Energie: E = m · c².",
   bedeutet:"1 Kilogramm Uran-235 ersetzt rund 2.700 Tonnen Steinkohle. Deshalb braucht ein Kernkraftwerk nur wenig Brennstoff und stößt im Betrieb kein CO₂ aus.",
   tipp:"Rechenaufgabe: Aus 1 Gramm verschwundener Masse werden rund 25 Millionen Kilowattstunden. So viel wird frei, wenn etwa 1 Kilogramm Uran-235 gespalten wird."
  }},
 {nr:6,b:2,titel:"Brennstab und Brennelement",zeichne:"brennstab",
  bild:"Von der Uran-Tablette über den Brennstab und das Brennelement bis zum Reaktorkern von oben.",
  schritte:[
   {titel:"Die Tablette",dauer:5,text:"Am Anfang steht die Uran-Tablette. Sie ist etwa 1 Zentimeter groß und hart wie Keramik."},
   {titel:"Der Brennstab",dauer:7,text:"Mehrere hundert Tabletten werden in ein dünnes Metallrohr gefüllt. Das Rohr ist rund 4 Meter lang, aber nur etwa 1 Zentimeter dick. Es wird gasdicht verschweißt. Das ist der Brennstab."},
   {titel:"Das Brennelement",dauer:7,text:"200 bis 300 Brennstäbe werden zu einem Bündel zusammengefasst. Abstandshalter halten die Stäbe auf Lücke, damit Wasser dazwischen durchfließen kann. Das Bündel heißt Brennelement."},
   {titel:"Der Reaktorkern",dauer:7,text:"Im Reaktor stehen viele Brennelemente dicht nebeneinander. In einem großen deutschen Druckwasserreaktor waren es 193. Zusammen enthalten sie rund 100 Tonnen Uran. Das ist der Reaktorkern."}
  ],
  merksatz:"Tabletten im Rohr sind ein Brennstab. Ein Bündel Brennstäbe ist ein Brennelement.",
  boxen:{
   was:"Ein Brennstab ist ein dünnes, gasdichtes Metallrohr voller Uran-Tabletten. Viele Brennstäbe zusammen bilden ein Brennelement.",
   so:"Tablette, Brennstab, Brennelement, Reaktorkern: vier Stufen, jede fasst die vorige zusammen.",
   bedeutet:"Das Hüllrohr hält die strahlenden Spaltprodukte fest. Nach der Tablette selbst ist es die zweite Barriere zwischen Brennstoff und Umwelt.",
   tipp:"Ein Brennelement bleibt etwa 3 bis 5 Jahre im Reaktor. Einmal im Jahr wird ein Teil der Elemente gegen frische getauscht."
  }},
 {nr:7,b:2,titel:"Der Moderator: Wasser bremst Neutronen",zeichne:"moderator",
  bild:"Ein schnelles Neutron fliegt am Uran-Kern vorbei. Im Wasser wird es durch Stöße langsam und spaltet dann den Kern.",
  schritte:[
   {titel:"Zu schnell",dauer:6,text:"Bei der Spaltung werden die Neutronen sehr schnell frei, mit rund 20.000 Kilometern pro Sekunde. So schnelle Neutronen spalten Uran-235 nur selten. Meist fliegen sie einfach vorbei."},
   {titel:"Wasser als Bremse",dauer:8,text:"Darum steht der Brennstoff im Wasser. Die Neutronen stoßen mit den Wasserstoff-Kernen im Wasser zusammen. Ein Wasserstoff-Kern ist fast genauso schwer wie ein Neutron. Deshalb gibt das Neutron bei jedem Stoß viel Tempo ab, wie eine Billardkugel."},
   {titel:"Langsam trifft",dauer:7,text:"Nach etwa 20 Stößen ist das Neutron rund 10.000-mal langsamer, nur noch etwa 2 Kilometer pro Sekunde. Jetzt fängt Uran-235 es leicht ein, und der Kern zerbricht. Ein Stoff, der Neutronen so abbremst, heißt Moderator."},
   {titel:"Eingebaute Sicherheit",dauer:7,text:"Das Wasser hat noch einen Vorteil. Wird es zu heiß oder verdampft es, bremst es schlechter. Dann gibt es weniger Spaltungen, und die Leistung sinkt von selbst."}
  ],
  merksatz:"Wasser bremst Neutronen. Nur langsame Neutronen spalten Uran-235 gut.",
  boxen:{
   was:"Ein Moderator ist ein Stoff, der schnelle Neutronen abbremst. In den meisten Reaktoren ist das ganz normales Wasser.",
   so:"Ein schnelles Neutron stößt mit Wasserstoff-Kernen zusammen, wird nach etwa 20 Stößen langsam und kann dann Uran-235 spalten.",
   bedeutet:"Ohne Moderator gäbe es in schwach angereichertem Uran keine Kettenreaktion. Geht das Wasser verloren, hört die Spaltung deshalb von selbst auf. Die Nachwärme bleibt aber (Lektion 18).",
   tipp:"Nicht verwechseln: Der Moderator bremst Neutronen, damit es mehr Spaltungen gibt. Die Steuerstäbe schlucken Neutronen, damit es weniger gibt."
  }},
 {nr:8,b:2,titel:"Steuerstäbe: Gas und Bremse",zeichne:"steuerstab",
  bild:"Steuerstäbe fahren von oben zwischen die Brennstäbe. Je tiefer sie stecken, desto weniger Neutronen und desto weniger Leistung.",
  schritte:[
   {titel:"Neutronen-Schlucker",dauer:6,text:"Steuerstäbe bestehen aus Stoffen, die Neutronen besonders gut schlucken, zum Beispiel Bor oder Cadmium. Ein geschlucktes Neutron kann keinen Kern mehr spalten."},
   {titel:"Stäbe rein: Bremse",dauer:6,text:"Fährt man die Steuerstäbe tiefer zwischen die Brennstäbe, schlucken sie mehr Neutronen. Es gibt weniger Spaltungen, die Leistung sinkt."},
   {titel:"Stäbe raus: Gas",dauer:6,text:"Zieht man die Stäbe ein Stück heraus, bleiben mehr Neutronen übrig. Die Zahl der Spaltungen steigt, der Reaktor liefert mehr Wärme."},
   {titel:"Ganz drin: aus",dauer:7,text:"Sind alle Steuerstäbe ganz eingefahren, bricht die Kettenreaktion ab. Bei einer Schnellabschaltung fallen sie im Druckwasserreaktor in etwa 2 Sekunden von selbst in den Kern, allein durch die Schwerkraft."}
  ],
  merksatz:"Stäbe rein: weniger Leistung. Stäbe raus: mehr Leistung.",
  boxen:{
   was:"Steuerstäbe sind Stäbe aus Stoffen, die Neutronen schlucken. Mit ihnen wird die Kettenreaktion geregelt und abgeschaltet.",
   so:"Tiefer hinein: weniger Neutronen, weniger Leistung. Weiter heraus: mehr Neutronen, mehr Leistung. Ganz hinein: aus.",
   bedeutet:"Die Steuerstäbe sind Gaspedal und Notbremse zugleich. Fällt der Strom aus, fallen sie im Druckwasserreaktor von selbst in den Kern.",
   tipp:"Im Druckwasserreaktor wird die Leistung im Alltag vor allem mit Borsäure im Wasser eingestellt. Auch Bor schluckt Neutronen. Die Steuerstäbe sind für schnelle Änderungen und das Abschalten da."
  }},
 {nr:9,b:2,titel:"Der Reaktordruckbehälter",zeichne:"behaelter",
  bild:"Schnitt durch den Reaktordruckbehälter: dicker Stahl, unten der Kern, oben die Steuerstäbe, Wasser strömt hindurch.",
  schritte:[
   {titel:"Ein Topf aus Stahl",dauer:6,text:"Der Reaktorkern steckt in einem riesigen Stahlbehälter. Er ist rund 12 Meter hoch, hat 5 Meter Durchmesser und eine Wand aus etwa 25 Zentimeter dickem Stahl."},
   {titel:"Der Kern sitzt unten",dauer:6,text:"Unten im Behälter stehen die Brennelemente. Von oben ragen die Steuerstäbe hinein. Der Deckel ist verschraubt und lässt sich zum Wechseln der Brennelemente abnehmen."},
   {titel:"Wasser strömt durch",dauer:8,text:"Wasser strömt seitlich ein, an der Wand nach unten und dann von unten nach oben durch den Kern. Dabei nimmt es die Wärme mit. Es kommt mit rund 290 Grad an und verlässt den Behälter mit rund 325 Grad."},
   {titel:"Warum der hohe Druck?",dauer:7,text:"Bei 325 Grad würde Wasser normalerweise längst kochen. Im Druckwasserreaktor steht es deshalb unter rund 155 bar. Das ist etwa der Druck in 1.500 Metern Meerestiefe. So bleibt das Wasser flüssig."}
  ],
  merksatz:"Dicker Stahl, hoher Druck: So bleibt das Wasser bei 325 Grad flüssig.",
  boxen:{
   was:"Der Reaktordruckbehälter ist ein dickwandiger Stahlbehälter. In ihm sitzen der Reaktorkern und das Wasser, das die Wärme abholt.",
   so:"Das Wasser strömt seitlich ein, an der Wand nach unten, durch den Kern nach oben und heiß wieder hinaus.",
   bedeutet:"Der Behälter muss 155 bar und über 300 Grad jahrzehntelang aushalten. Er ist die dritte Barriere und lässt sich nicht austauschen. Sein Zustand bestimmt mit, wie lange ein Kraftwerk laufen darf.",
   tipp:"Diese Zahlen gelten für den Druckwasserreaktor. Im Siedewasserreaktor sind es nur rund 70 bar, dort darf das Wasser im Behälter kochen (Lektion 12)."
  }},
 {nr:10,b:2,titel:"Kritisch, unterkritisch, überkritisch",zeichne:"kritisch",
  bild:"Diagramm Leistung über Zeit: Die Kurve fällt bei k kleiner 1, bleibt gleich bei k gleich 1 und steigt bei k größer 1.",
  schritte:[
   {titel:"Die Zahl k",dauer:7,text:"Entscheidend ist eine einzige Zahl: Wie viele Neutronen aus einer Spaltung lösen wieder eine Spaltung aus? Fachleute nennen diese Zahl k."},
   {titel:"Unterkritisch: k kleiner als 1",dauer:6,text:"Ist k kleiner als 1, werden es von Runde zu Runde weniger Spaltungen. Die Kettenreaktion schläft ein. So ist es beim abgeschalteten Reaktor."},
   {titel:"Kritisch: k genau 1",dauer:6,text:"Ist k genau 1, bleibt die Zahl der Spaltungen gleich. Das klingt gefährlich, ist aber der ganz normale Betrieb: Der Reaktor liefert gleichmäßig Leistung."},
   {titel:"Überkritisch: k größer als 1",dauer:7,text:"Ist k größer als 1, steigt die Leistung. Zum Hochfahren stellt man k nur ganz knapp über 1 ein, zum Beispiel auf 1,001. Dann wächst die Leistung langsam und gut beherrschbar."},
   {titel:"Die Kunst des Regelns",dauer:8,text:"Steuerstäbe, Bor im Wasser und die Wassertemperatur verschieben k. Im Betrieb wird k auf genau 1 gehalten. Für mehr Leistung geht man kurz knapp darüber, für weniger knapp darunter."}
  ],
  merksatz:"k unter 1: es wird weniger. k gleich 1: es bleibt. k über 1: es wird mehr.",
  boxen:{
   was:"Kritisch heißt: Jede Spaltung löst im Schnitt genau eine neue aus. Das ist der Normalbetrieb und kein Alarmwort.",
   so:"k kleiner als 1: unterkritisch, die Leistung fällt. k gleich 1: kritisch, die Leistung bleibt. k größer als 1: überkritisch, die Leistung steigt.",
   bedeutet:"Ein Reaktor wird nicht mit einem Schalter eingeschaltet. Man hebt k ganz knapp über 1, wartet, bis die gewünschte Leistung erreicht ist, und stellt wieder genau 1 ein.",
   tipp:"Rechenaufgabe: 100 Spaltungen, k = 0,9. Nach einer Runde sind es 90, nach zwei Runden 81."
  }},
 {nr:11,b:3,titel:"Druckwasserreaktor: zwei Kreisläufe",zeichne:"dwr",
  bild:"Schema eines Druckwasserreaktors: Reaktor und Dampferzeuger im Sicherheitsbehälter, daneben Turbine, Generator, Kondensator und Kühlturm.",
  schritte:[
   {titel:"Der erste Kreislauf",dauer:7,text:"Im Druckwasserreaktor gibt es zwei getrennte Wasserkreisläufe. Im ersten pumpen große Pumpen das Wasser durch den Reaktor. Dort wird es 325 Grad heiß. Es kocht aber nicht, weil es unter 155 bar Druck steht."},
   {titel:"Der Dampferzeuger",dauer:7,text:"Das heiße Wasser fließt durch tausende dünne Rohre im Dampferzeuger. Außen an den Rohren fließt das Wasser des zweiten Kreislaufs. Es nimmt die Wärme auf und verdampft. Die beiden Wasser berühren sich nie."},
   {titel:"Der zweite Kreislauf",dauer:8,text:"Der Dampf strömt mit rund 65 bar zur Turbine und dreht sie. Die Turbine treibt den Generator an, der Strom erzeugt. Danach wird der Dampf im Kondensator wieder zu Wasser und zurückgepumpt."},
   {titel:"Der Kühlkreis",dauer:6,text:"Ein dritter Wasserkreis kühlt den Kondensator. Er führt die Abwärme an einen Fluss oder über den Kühlturm an die Luft ab."},
   {titel:"Warum zwei Kreisläufe?",dauer:7,text:"Das Wasser aus dem Reaktor ist leicht radioaktiv. Weil es im ersten Kreislauf bleibt, kommt die Turbine nur mit sauberem Dampf in Berührung. Alles Radioaktive bleibt im Sicherheitsbehälter."}
  ],
  merksatz:"Zwei Kreisläufe: Der erste holt die Wärme, der zweite macht daraus Dampf für die Turbine.",
  boxen:{
   was:"Der Druckwasserreaktor ist die häufigste Bauart der Welt. Er hat zwei getrennte Wasserkreisläufe, die nur Wärme austauschen.",
   so:"Erster Kreislauf: Reaktor, Dampferzeuger, Pumpe. Zweiter Kreislauf: Dampferzeuger, Turbine, Kondensator, Pumpe. Dazu kommt der Kühlkreis zum Kühlturm oder Fluss.",
   bedeutet:"Radioaktives Wasser bleibt im Sicherheitsbehälter. Die Turbine läuft mit sauberem Dampf und kann wie in einem normalen Kraftwerk gewartet werden.",
   tipp:"Ein großer Druckwasserreaktor hat nicht einen, sondern vier Dampferzeuger und vier Hauptpumpen. Im Bild ist nur ein Strang gezeichnet."
  }},
 {nr:12,b:3,titel:"Siedewasserreaktor: ein Kreislauf",zeichne:"swr",
  bild:"Schema eines Siedewasserreaktors: Der Dampf geht aus dem Reaktor direkt zur Turbine, ohne Dampferzeuger.",
  schritte:[
   {titel:"Wasser kocht im Reaktor",dauer:7,text:"Im Siedewasserreaktor darf das Wasser direkt im Reaktor kochen. Der Druck ist mit rund 70 bar nur halb so hoch wie im Druckwasserreaktor. Über dem Kern entsteht Dampf von etwa 285 Grad."},
   {titel:"Dampf direkt zur Turbine",dauer:7,text:"Der Dampf strömt ohne Umweg zur Turbine. Einen Dampferzeuger gibt es nicht. Nach der Turbine wird der Dampf im Kondensator zu Wasser und zurück in den Reaktor gepumpt."},
   {titel:"Einfacher, aber mit Haken",dauer:7,text:"Das spart Bauteile. Der Nachteil: Der Dampf kommt aus dem Reaktor und ist leicht radioaktiv. Deshalb gehört auch die Turbine zum Kontrollbereich und muss abgeschirmt werden."},
   {titel:"Steuerstäbe von unten",dauer:7,text:"Oben im Behälter sitzen die Dampftrockner. Die Steuerstäbe werden deshalb von unten in den Kern geschoben, mit Wasserdruck statt durch die Schwerkraft."},
   {titel:"Der Vergleich",dauer:8,text:"Beide Bauarten nutzen Wasser zum Kühlen und zum Bremsen der Neutronen. In Deutschland liefen beide, zum Beispiel Isar 2 als Druckwasserreaktor und Gundremmingen als Siedewasserreaktor. Weltweit sind Druckwasserreaktoren am häufigsten."}
  ],
  merksatz:"Siedewasser: ein Kreislauf, das Wasser kocht im Reaktor.",
  boxen:{
   was:"Im Siedewasserreaktor kocht das Wasser direkt im Reaktor. Der Dampf geht ohne Umweg zur Turbine. Es gibt nur einen Kreislauf.",
   so:"Reaktor, Turbine, Kondensator, Pumpe und zurück. Der Druck liegt bei rund 70 bar, die Steuerstäbe kommen von unten.",
   bedeutet:"Es gibt weniger Bauteile, aber die Turbine wird im Betrieb leicht radioaktiv. Nach dem Abschalten klingt das schnell ab, weil die Stoffe im Dampf nur Sekunden bis Minuten strahlen.",
   tipp:"Die Reaktoren in Fukushima waren Siedewasserreaktoren. Tschernobyl war eine ganz andere Bauart mit Graphit (Lektion 20)."
  }},
 {nr:13,b:3,titel:"Der Dampferzeuger",zeichne:"dampferzeuger",
  bild:"Schnitt durch einen Dampferzeuger: innen U-Rohre mit heißem Reaktorwasser, außen verdampft das Speisewasser, oben tritt Dampf aus.",
  schritte:[
   {titel:"Ein riesiger Wärmetauscher",dauer:6,text:"Der Dampferzeuger ist rund 20 Meter hoch. In ihm stecken etwa 4.000 dünne Rohre, jedes wie ein umgedrehtes U gebogen."},
   {titel:"Innen: heißes Reaktorwasser",dauer:7,text:"Das Wasser aus dem Reaktor strömt unten in die Rohre, steigt auf, läuft durch den Bogen und kommt auf der anderen Seite wieder heraus. Dabei kühlt es von 325 auf etwa 290 Grad ab."},
   {titel:"Außen: Wasser wird zu Dampf",dauer:7,text:"Außen um die Rohre fließt das Wasser des zweiten Kreislaufs. Es kommt mit rund 220 Grad an, wird an den heißen Rohren weiter erhitzt und verdampft."},
   {titel:"Trockener Dampf",dauer:7,text:"Oben im Dampferzeuger werden Wassertröpfchen abgeschieden, denn Tropfen würden die Turbinenschaufeln beschädigen. Heraus kommt trockener Dampf mit rund 280 Grad und 65 bar."},
   {titel:"Dünn, aber dicht",dauer:8,text:"Die Rohrwände sind nur etwa 1 Millimeter dick, damit die Wärme gut hindurchgeht. Trotzdem müssen sie dicht bleiben, denn sie trennen das radioaktive Wasser vom sauberen. Deshalb werden die Rohre regelmäßig geprüft."}
  ],
  merksatz:"Innen heißes Reaktorwasser, außen entsteht Dampf. Dazwischen nur eine dünne Rohrwand.",
  boxen:{
   was:"Der Dampferzeuger ist ein Wärmetauscher. Er überträgt die Wärme vom Reaktorwasser auf das Wasser des zweiten Kreislaufs, ohne dass sich beide mischen.",
   so:"Heißes Reaktorwasser fließt innen durch die U-Rohre. Außen verdampft das Speisewasser. Oben werden Tropfen abgeschieden.",
   bedeutet:"Die dünnen Rohre gehören zur Grenze des ersten Kreislaufs. Ein undichtes Rohr würde Radioaktivität in den zweiten Kreislauf bringen. Deshalb wird geprüft und notfalls ein Rohr verschlossen.",
   tipp:"Nur der Druckwasserreaktor hat Dampferzeuger. Der Siedewasserreaktor braucht keinen."
  }},
 {nr:14,b:3,titel:"Turbine und Generator",zeichne:"turbine",
  bild:"Dampf dreht das Schaufelrad der Turbine. Auf derselben Welle sitzt der Generator, in dem sich ein Magnet in einer Spule dreht.",
  schritte:[
   {titel:"Dampf trifft Schaufeln",dauer:6,text:"Der Dampf strömt mit hoher Geschwindigkeit auf die Schaufeln der Turbine und versetzt sie in Drehung. Aus Wärme wird Bewegung."},
   {titel:"Hochdruck und Niederdruck",dauer:7,text:"Der Dampf gibt seine Energie in Stufen ab. Erst durchströmt er die Hochdruck-Turbine, dann die Niederdruck-Turbinen. Dabei dehnt er sich aus. Deshalb werden die Schaufeln immer länger, am Ende über 1 Meter."},
   {titel:"1.500 Umdrehungen pro Minute",dauer:6,text:"Die Welle dreht sich 1.500-mal pro Minute, also 25-mal pro Sekunde. Mit allen Turbinen und dem Generator ist sie über 50 Meter lang."},
   {titel:"Der Generator",dauer:7,text:"Am Ende der Welle sitzt der Generator. In ihm dreht sich ein starker Magnet in einer Spule aus Kupfer. Das erzeugt Strom, im Prinzip wie bei einem Fahrrad-Dynamo. Heraus kommt Wechselstrom mit 50 Hertz."},
   {titel:"Die Leistung",dauer:7,text:"Ein großes Kernkraftwerk liefert rund 1.400 Megawatt Strom. Das reicht für etwa 3 Millionen Haushalte."}
  ],
  merksatz:"Dampf dreht die Turbine, die Turbine dreht den Generator, der Generator macht Strom.",
  boxen:{
   was:"Die Turbine macht aus der Energie des Dampfes eine Drehung. Der Generator macht aus der Drehung Strom.",
   so:"Der Dampf strömt erst durch die Hochdruck-, dann durch die Niederdruck-Turbinen. Alle sitzen mit dem Generator auf einer Welle.",
   bedeutet:"Dieser Teil ist in jedem Wärmekraftwerk fast gleich, egal ob die Wärme aus Kohle, Gas oder Uran kommt. Nur die Wärmequelle ist anders.",
   tipp:"Rechenaufgabe: 1.400 Megawatt, ein Jahr lang rund um die Uhr, ergeben etwa 12 Milliarden Kilowattstunden."
  }},
 {nr:15,b:3,titel:"Kondensator und Kühlturm",zeichne:"kuehlturm",
  bild:"Im Kondensator wird Dampf an kalten Rohren zu Wasser. Im Kühlturm rieselt das warme Kühlwasser herab, darüber steht eine Wolke aus Wasserdampf.",
  schritte:[
   {titel:"Dampf muss wieder Wasser werden",dauer:7,text:"Hinter der Turbine ist der Dampf dünn und nur noch etwa 35 Grad warm. Im Kondensator strömt er an kalten Rohren vorbei und wird wieder zu Wasser. Erst dann kann er zurückgepumpt werden."},
   {titel:"Der Unterdruck hilft",dauer:7,text:"Beim Verflüssigen schrumpft der Dampf gewaltig. Dadurch entsteht im Kondensator fast ein Vakuum. Dieser Sog zieht den Dampf durch die Turbine und holt mehr Arbeit aus ihm heraus."},
   {titel:"Der Kühlturm",dauer:7,text:"Das Kühlwasser hat sich im Kondensator erwärmt. Im Kühlturm rieselt es herab, während Luft von unten nach oben zieht. Ein kleiner Teil verdunstet und kühlt den Rest ab."},
   {titel:"Die Wolke ist nur Wasserdampf",dauer:6,text:"Die weiße Fahne über dem Kühlturm ist reiner Wasserdampf, wie aus einem Kochtopf. Dieses Wasser hat nie Kontakt mit dem Reaktor und ist nicht radioaktiv."},
   {titel:"Zwei Drittel gehen verloren",dauer:7,text:"Von der Wärme aus dem Reaktor wird nur etwa ein Drittel zu Strom. Zwei Drittel gehen als Abwärme über Kühlturm oder Fluss weg. Das ist bei jedem Wärmekraftwerk ähnlich, moderne Kohlekraftwerke schaffen etwas mehr."}
  ],
  merksatz:"Der Kondensator macht Dampf zu Wasser. Die Wolke über dem Kühlturm ist nur Wasserdampf.",
  boxen:{
   was:"Der Kondensator macht aus dem Dampf wieder Wasser. Der Kühlturm gibt die dabei frei werdende Wärme an die Luft ab.",
   so:"Der Dampf strömt an kalten Rohren vorbei und wird flüssig. Das erwärmte Kühlwasser rieselt im Kühlturm herab und kühlt durch Verdunstung ab.",
   bedeutet:"Ein Kraftwerk braucht viel Kühlwasser. In heißen Sommern mit wenig oder zu warmem Flusswasser müssen Kraftwerke deshalb manchmal ihre Leistung senken.",
   tipp:"Nicht jedes Kernkraftwerk hat einen Kühlturm. Liegt es an einem großen Fluss oder am Meer, kann es direkt mit diesem Wasser kühlen."
  }},
 {nr:16,b:4,titel:"Die Barrieren",zeichne:"barrieren",
  bild:"Fünf Hüllen liegen wie Zwiebelschalen um den Brennstoff: Tablette, Hüllrohr, Druckbehälter, Stahlkugel und Betonhülle.",
  schritte:[
   {titel:"Die Tablette selbst",dauer:6,text:"Die erste Barriere ist der Brennstoff. Die keramische Tablette hält den größten Teil der radioaktiven Spaltprodukte in ihrem Inneren fest."},
   {titel:"Das Hüllrohr",dauer:6,text:"Um die Tabletten liegt das gasdicht verschweißte Hüllrohr. Es fängt auch die gasförmigen Spaltprodukte auf."},
   {titel:"Der Reaktordruckbehälter",dauer:6,text:"Der Druckbehälter und die Rohre des ersten Kreislaufs bilden die dritte Barriere. Sie sind aus dickem Stahl."},
   {titel:"Der Sicherheitsbehälter",dauer:7,text:"Der ganze erste Kreislauf steht in einer gasdichten Stahlkugel. Sie hat rund 56 Meter Durchmesser und soll auch bei einem Rohrbruch alles einschließen."},
   {titel:"Die Betonhülle",dauer:7,text:"Außen schützt eine fast 2 Meter dicke Hülle aus Stahlbeton. Sie hält Strahlung zurück und schützt die Anlage vor Einwirkungen von außen, zum Beispiel vor einem Flugzeugabsturz."}
  ],
  merksatz:"Mehrere Hüllen hintereinander: Versagt eine, hält die nächste.",
  boxen:{
   was:"Barrieren sind hintereinander liegende Hüllen, die die radioaktiven Stoffe einschließen. Versagt eine, hält die nächste.",
   so:"Von innen nach außen: Tablette, Hüllrohr, Druckbehälter mit erstem Kreislauf, Sicherheitsbehälter aus Stahl, Hülle aus Stahlbeton.",
   bedeutet:"Radioaktivität kann nur austreten, wenn mehrere Barrieren gleichzeitig versagen. Deshalb ist die Kühlung so wichtig: Zu große Hitze kann gleich mehrere Barrieren zerstören.",
   tipp:"Manche Bücher zählen sechs Barrieren, weil sie den Betonschild rund um den Druckbehälter mitzählen. Das Prinzip ist dasselbe."
  }},
 {nr:17,b:4,titel:"Die Schnellabschaltung",zeichne:"scram",
  bild:"Ein Messwert verlässt den erlaubten Bereich, die Magnete lassen los, die Steuerstäbe fallen in den Kern und die Leistung bricht ein.",
  schritte:[
   {titel:"Ein Signal genügt",dauer:7,text:"Der Reaktorschutz überwacht ständig Druck, Temperatur, Wasserstand und die Zahl der Neutronen. Verlässt ein wichtiger Wert den erlaubten Bereich, löst er automatisch die Schnellabschaltung aus."},
   {titel:"Die Stäbe fallen",dauer:7,text:"Die Steuerstäbe hängen an Elektromagneten. Wird der Strom unterbrochen, lassen die Magnete los, und die Stäbe fallen durch ihr Gewicht in den Kern. Das dauert etwa 2 Sekunden."},
   {titel:"Die Kettenreaktion stoppt",dauer:6,text:"Die Stäbe schlucken die Neutronen. Die Kettenreaktion bricht ab, und die Leistung aus der Spaltung fällt in Sekunden auf fast null."},
   {titel:"Sicher auch ohne Strom",dauer:7,text:"Das Prinzip heißt fail-safe: Fällt etwas aus, geht die Anlage von selbst in den sicheren Zustand. Gerade ein Stromausfall löst die Abschaltung aus, statt sie zu verhindern."},

      kugel(x,misch(X(k)+4,X(k)+30,u),misch(Y+12,192,u),3,C.blau,a*(u<1?1:.35));
    }
    pille(x,180,38,"im Schnitt löst genau 1 die nächste aus",akz,a);
    pille(x,180,250,"gleichmäßige Wärme",C.gold,klemm(h-3.5));
  }
 },
 masse(x,s,p,t,akz){
  if(s<=1){
    const weg=s===1?weich(klemm(p*1.6)):0, A=1-weg, b2=s===0?klemm(p*1.5):1, lueckeA=s===0?klemm(p*3-1.8):1;
    schrift(x,"vorher: Uran-236",180,68,C.grau,11,A); block(x,50,80,260,24,akz,A);
    schrift(x,"nachher: 2 Bruchstücke + 3 Neutronen",180,136,C.grau,11,A*b2); block(x,50,148,244*b2,24,akz,A);
    block(x,misch(294,172,weg),misch(148,112,weg),16,24,C.gold,lueckeA*(s===1?1-klemm(p*3-1.4):1),3);
    if(s===0){pille(x,180,205,"es fehlt rund ein Tausendstel",C.gold,lueckeA); schrift(x,"(Lücke im Bild stark vergrößert)",180,232,C.grau,10,lueckeA);}
    else{schrift(x,"E = m · c²",180,124,C.gold,34,klemm(p*3-1.4),700); pille(x,180,186,"wenig Masse → sehr viel Energie",C.text,klemm(p*3-2));}
  }else if(s===2){
    const a=klemm(p*4), n=Math.round(45*klemm((p-.15)/.7)), e=n===45?1:0;
    block(x,42,118,26,26,akz,a); pille(x,55,166,"1 kg Uran-235",akz,a); schrift(x,"=",98,131,C.text,20,a,700);
    for(let i=0;i<n;i++)block(x,124+(i%9)*24,88+((i/9)|0)*18,20,11,C.grau,1,2);
    pille(x,230,204,"2.700 t Steinkohle",C.text,e); pille(x,230,230,"rund 45 Güterwagen",C.grau,e);
  }else{
    const a=klemm(p*3), u=weich(klemm((p-.25)/.6)), e=klemm(u*3-2);
    schrift(x,"Wärme aus der Spaltung · 100 %",180,56,C.gold,11,a,700); block(x,45,68,270,24,C.gold,a);
    pfeil(x,180,98,180,126,C.grau,a);
    block(x,45,134,90*u,24,C.gruen,1); block(x,137,134,178*u,24,C.grau,.7);
    pille(x,90,184,"1/3 Strom",C.gruen,e); pille(x,226,184,"2/3 Abwärme",C.grau,e);
    pille(x,180,236,"Abwärme geht über Kühlturm oder Fluss weg",C.text,klemm(p*4-3));
  }
 },
 spaltung(x,s,p,t,akz){
  const MX=180,MY=138,R=46,RA=36,RB=29,AX=98,BX=264;
  const aufbau=s===0?klemm(p*1.6):1;
  const anflug=s<1?0:s===1?weich(klemm(p*1.15)):1;
  const d=s<2?0:s===2?klemm(p*p*1.05+.14*Math.sin(p*20)*(1-p)):1;
  const sp=s<3?0:s===3?weich(klemm(p*1.25)):1;
  const waerme=s===4?p:0;
  const nBlau=C.blau, pRot=C.rot;

  // Wärme-Ringe hinter den Bruchstücken
  if(s===4){[[AX,RA],[BX,RB]].forEach(([cx,r])=>{for(let k=0;k<3;k++){const f=(waerme*2.2+k/3)%1;
    x.save();x.globalAlpha=(1-f)*.55*klemm(waerme*4);x.strokeStyle=C.gold;x.lineWidth=2;x.beginPath();x.arc(cx,MY,r+5+f*24,0,6.2832);x.stroke();x.restore()}})}

  // Teilchen des Kerns
  KERN.forEach(n=>{
    if(n.gast&&s<2)return;
    const dx=n.bx*R*(1+.5*d), dy=n.by*R*(1-.42*d*Math.exp(-Math.pow(n.bx/.38,2)))+Math.sin(t*9+n.i)*1.3*d*(1-sp);
    const zx=(n.gruppe?BX:AX)-MX+n.zx*(n.gruppe?RB:RA), zy=n.zy*(n.gruppe?RB:RA);
    const px=MX+misch(dx,zx,sp), py=MY+misch(dy,zy,sp);
    const sichtbar=klemm(aufbau*1.4-(n.i/70)*.4);
    kugel(x,px,py,5.4,n.proton?pRot:nBlau,sichtbar);
  });

  // anfliegendes Neutron
  if(s===1){const nx=misch(22,MX-R-4,anflug);
    x.save();x.globalAlpha=.5;x.strokeStyle=nBlau;x.lineWidth=2;x.setLineDash([3,4]);x.beginPath();x.moveTo(Math.max(14,nx-38),MY);x.lineTo(nx-8,MY);x.stroke();x.restore();
    kugel(x,nx,MY,5.4,nBlau);
    x.save();x.strokeStyle=C.text;x.lineWidth=1.2;x.beginPath();x.arc(nx,MY,8.5,0,6.2832);x.stroke();x.restore();
    pille(x,Math.max(74,nx),MY-24,"langsames Neutron",nBlau,klemm(p*5));
  }

  // freie Neutronen
  if(s>=3){const richt=[[-.42,-.91],[.5,-.87],[.12,.99]], weg=24+72*sp+(s===4?waerme*6:0), a=klemm((sp-.12)*4);
    richt.forEach(([rx,ry])=>{const nx=MX+rx*weg, ny=MY+ry*weg;
      x.save();x.globalAlpha=.45*a;x.strokeStyle=nBlau;x.lineWidth=1.6;x.setLineDash([3,4]);x.beginPath();x.moveTo(MX+rx*(weg-26),MY+ry*(weg-26));x.lineTo(nx-rx*8,ny-ry*8);x.stroke();x.restore();
      kugel(x,nx,ny,5.4,nBlau,a);
      if(s===4)pfeil(x,nx+rx*9,ny+ry*9,nx+rx*22,ny+ry*22,nBlau,klemm(waerme*3));
    });
  }

  // Beschriftungen
  if(s<=1){pille(x,MX,MY-R-22,"URAN-235",akz,aufbau);}
  if(s===0){pille(x,MX,MY+R+24,"92 Protonen · 143 Neutronen",C.text,klemm(p*2.2-.6));}
  if(s<=1){const a=s===0?klemm(p*2.2-.9):1;
    kugel(x,112,264,5,pRot,a);kugel(x,196,264,5,nBlau,a);
    x.save();x.globalAlpha=a;x.font='500 11px "JetBrains Mono",monospace';x.fillStyle=C.grau;x.textBaseline="middle";x.fillText("Proton",122,264.500);x.fillText("Neutron",206,264.500);x.restore();}
  if(s===2){pille(x,MX,MY-R-26,"URAN-236 · instabil",C.gold);
    pille(x,MX,MY+R+30,"schwingt und schnürt sich ein",C.text,klemm(p*3-.6));}
  if(s>=3){const a=klemm(sp*2-.7);
    pille(x,AX,MY+RA+22,"BARIUM-141",akz,a); pille(x,BX,MY+RB+29,"KRYPTON-92",akz,a);
    pille(x,MX,22,"3 freie Neutronen",nBlau,klemm(sp*2-1));
    if(s===3)pfeil(x,AX-RA-6,MY,AX-RA-22,MY,C.grau,a), pfeil(x,BX+RB+6,MY,BX+RB+22,MY,C.grau,a);}
  if(s===4){const a=klemm(waerme*3); pille(x,MX+1,MY-12,"WÄRME",C.gold,a); pille(x,MX+1,MY+12,"200 MeV",C.gold,a);}
 }
};
